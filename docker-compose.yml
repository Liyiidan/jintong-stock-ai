services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stockai}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stockai}']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DATA_DEPS: ${INSTALL_DATA_DEPS:-false}
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stockai}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
      DATA_MODE: ${DATA_MODE:-real}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZHIPU_ALLOW_CROSS_ROLE_KEY_FALLBACK: ${ZHIPU_ALLOW_CROSS_ROLE_KEY_FALLBACK:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@jintong.example.com}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Demo123456!}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '8080:80'
    healthcheck:
      # Alpine may resolve localhost to IPv6 while nginx listens on IPv4.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  db_data:
